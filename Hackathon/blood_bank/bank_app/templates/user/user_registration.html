<!DOCTYPE html>
<html lang="en">
    {% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    {% include 'common/common_css.html' %}
</head>

<body>
    {% include 'common/navbar.html' %}
    {% include 'common/message.html' %}
    <div class="main-div d-flex justify-content-center align-items-center">
        <div class="registration-card card p-4 shadow-sm" style="max-width: 500px; width: 100%;">
            <h2 class="text-center mb-4 text-navy">User Registration</h2>
            <form action="{% url 'user-registration' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="user-name" class="form-label fw-semibold">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter your full name" required pattern="[A-Za-z ]+" title="Only alphabets allowed" id="user-name">
                </div>

                <div class="mb-3">
                    <label for="user-phone" class="form-label fw-semibold">Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="Enter 10-digit phone number" required pattern="[0-9]{10}" title="Only numerics allowed" id="user-phone">
                </div>

                <div class="mb-3">
                    <label for="user-email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required id="user-email">
                </div>

                <div class="mb-3">
                    <label for="user-address" class="form-label fw-semibold">Locality Address</label>
                    <input type="text" name="address" class="form-control" placeholder="Enter your address" required id="user-address">
                </div>

                <div class="mb-3">
                    <label for="user-password" class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create Password" required id="user-password" minlength="8">
                </div>

                <div class="mb-3">
                    <label for="rating" class="form-label fw-semibold">Blood Group</label>
                    <select id="rating" name="blood_group" required class="form-select">
                        <option value="">Select your blood group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="user-photo" class="form-label fw-semibold">Profile Photo</label>
                    <input id="user-photo" type="file" name="profile_pic" accept=".jpg, .jpeg, .png, .gif, .webp" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
        </div>
    </div>

    <!-- footer code includede here always  -->
    {% include 'common/footer.html' %}
</body>

</html>
