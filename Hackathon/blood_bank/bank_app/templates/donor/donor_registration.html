<!DOCTYPE html>
<html lang="en">
    {% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - Lifeline</title>
    {% include 'common/common_css.html' %}
</head>

<body>
    {% include 'common/navbar.html' %}

    <div class="main-div d-flex justify-content-center align-items-center">
        <div class="registration-card card p-4 shadow-sm" style="max-width: 550px; width: 100%;">
            <div class="text-center mb-4">
                <span class="blood-badge badge-lg mb-2">🩸 Become a Hero</span>
                <h2 class="text-navy fw-bold mb-1">Donor Registration</h2>
                <p class="text-muted small">Register to save lives in your local community</p>
            </div>

            <form action="{% url 'donor-registration' %}" method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" required pattern="[A-Za-z ]+" title="Only alphabets allowed">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-digit number" required pattern="[0-9]{10}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. john@example.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="blood_group" class="form-label fw-semibold">Blood Group</label>
                        <select id="blood_group" name="blood_group" class="form-select" required>
                            <option value="">Select Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="last_donation_date" class="form-label fw-semibold">Last Donation Date</label>
                        <input type="date" id="last_donation_date" name="last_donation_date" class="form-control">
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="never_donated" name="never_donated" onchange="document.getElementById('last_donation_date').disabled = this.checked; if(this.checked) document.getElementById('last_donation_date').value = '';">
                            <label class="form-check-label text-muted small" for="never_donated">
                                Never donated blood before
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="locality" class="form-label fw-semibold">Locality / Area</label>
                    <input type="text" id="address" name="address" class="form-control" placeholder="Enter your city/area" required>
                </div>

                <div class="mb-4">
                    <label for="health_conditions" class="form-label fw-semibold">Health Conditions / Medical Notes</label>
                    <textarea id="health_conditions" name="health_conditions" class="form-control" rows="3" placeholder="Mention any medical conditions or none"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">Register as Donor</button>
            </form>
        </div>
    </div>

    {% include 'common/footer.html' %}
</body>
</html>
