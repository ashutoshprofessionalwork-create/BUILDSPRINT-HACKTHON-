<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Donor Profile - Lifeline</title>
    {% include 'common/common_css.html' %}

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg, #F8FAFC);
        }

        /* CARD STYLING */
        .glass-card {
            background: #FFFFFF !important;
            border: 1px solid var(--color-border, #E2E8F0) !important;
            border-radius: var(--radius-lg, 12px) !important;
            box-shadow: var(--shadow-md, 0 4px 6px -1px rgba(0, 0, 0, 0.1)) !important;
            max-width: 900px;
            width: 90%;
            margin: 2rem auto;
        }

        /* TEXT */
        .text-input {
            color: var(--color-navy, #1E293B);
            font-size: 1rem;
            font-weight: 500;
        }

        .label-text {
            color: var(--color-navy, #1E293B);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            display: block;
        }
    </style>
</head>

<body>
    {% include 'donor/donor_header.html' %}
    {% include 'common/message.html' %}

    <div class="main-div">
        <div class="card shadow-lg border-0 rounded-4 glass-card">
            <form method="POST">
                {% csrf_token %}
                <div class="card-body p-4 p-md-5">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="fw-bold text-navy h4 mb-0">
                            Update Donor Profile
                        </h2>
                        <span class="badge bg-danger">Donor Account</span>
                    </div>

                    <hr class="mb-4">

                    <div class="row gy-3">

                        <div class="col-md-6">
                            <label class="label-text">Full Name</label>
                            <input class="form-control text-input" name="name" value="{{ donor_key.name }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="label-text">Phone Number</label>
                            <input class="form-control text-input" name="phone" value="{{ donor_key.phone }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="label-text">Blood Group</label>
                            <select name="blood_group" class="form-select text-input" required>
                                <option value="A+" {% if donor_key.blood_group == "A+" %}selected{% endif %}>A+</option>
                                <option value="A-" {% if donor_key.blood_group == "A-" %}selected{% endif %}>A-</option>
                                <option value="B+" {% if donor_key.blood_group == "B+" %}selected{% endif %}>B+</option>
                                <option value="B-" {% if donor_key.blood_group == "B-" %}selected{% endif %}>B-</option>
                                <option value="AB+" {% if donor_key.blood_group == "AB+" %}selected{% endif %}>AB+</option>
                                <option value="AB-" {% if donor_key.blood_group == "AB-" %}selected{% endif %}>AB-</option>
                                <option value="O+" {% if donor_key.blood_group == "O+" %}selected{% endif %}>O+</option>
                                <option value="O-" {% if donor_key.blood_group == "O-" %}selected{% endif %}>O-</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="label-text">Current Address / Locality</label>
                            <input class="form-control text-input" name="locality" value="{{ donor_key.locality }}" placeholder="Enter your current address/locality" required>
                        </div>

                        <div class="col-md-12">
                            <label class="label-text">Health Conditions / Medical Notes</label>
                            <textarea class="form-control text-input" name="health_conditions" rows="3">{{ donor_key.health_conditions }}</textarea>
                        </div>

                        <div class="col-md-12">
                            <label class="label-text">Email Address</label>
                            <div class="form-control-plaintext text-navy fw-semibold">{{ donor_key.email }}</div>
                        </div>

                    </div>

                    <div class="text-end mt-4">
                        <button type="submit" class="btn btn-primary px-4 py-2">Save Changes</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    {% include 'common/footer.html' %}
</body>

</html>
