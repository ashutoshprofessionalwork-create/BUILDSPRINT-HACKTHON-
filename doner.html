<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doner Registration</title>
    <link rel="stylesheet" href="doner.css">
</head>
<header>
    <h1>Blood Donation Portal</h1>
    <p>🩸Where Donors Meet Those in Need🩸</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#register">Register</a>
    <a href="#request">Request Blood</a>
    <a href="#contact">Contact</a>
</nav>
<body>
    <div class="container">
        <h1>Doner Registration</h1>
        <form action="register" method="POST">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"  placeholder="eg:abc" required><br><br>
            
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="eg:xyz@gmail.com" required><br><br>

            <label for="blood_group">Blood Group:</label>
            <select id="blood_group" name="blood_group" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select><br><br>

            <label for="locality">Locality:</label>
            <input type="text" id="locality" name="locality" required><br><br>
            
            <label for="last_donation_date">Last Donation Date:</label>
            <input type="date" id="last_donation_date" name="last_donation_date" required><br><br>
            
            <label for="health_conditions">Health Conditions:</label>
            <textarea id="health_conditions" name="health_conditions" rows="4" cols="50"></textarea><br><br>

            <button type="submit">Register</button>
        </form>
         

        <div class="pateint">
            <h2>Patient Registration</h2>
            <form action="patient_register" method="POST">
                <label for="patient_name">Full Name:</label>
                <input type="text" id="patient_name" name="patient_name" required><br><br>

                <label for="patient_phone">Phone Number:</label>
                <input type="tel" id="patient_phone" name="patient_phone" required><br><br>

                <label for="patient_email">Email:</label>
                <input type="email" id="patient_email" name="patient_email" required><br><br>

                <label for="required_blood_group">Required Blood Group:</label>
                <select id="required_blood_group" name="required_blood_group" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select><br><br>

                <label for="locality">Locality:</label>
                <input type="text" id="locality" name="locality" required><br><br>
                <label for="condition">Patient Condition:</label>
                <textarea id="condition" name="condition" rows="4" cols="50"></textarea><br><br>

                <label for="hospital">Hospital Name:</label>
                <input type="text" id="hospital" name="hospital" required><br><br>

                <label for="medical_report">Medical Report:</label>
                <input type="file" id="medical_report" name="medical_report" accept=".pdf,.doc,.docx" required><br><br>
                <button type="submit">Register</button>
            </form>
         
            

</body>
</html>
